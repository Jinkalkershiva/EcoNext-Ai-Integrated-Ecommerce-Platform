name: EcoNext Continuous Deployment

on:
  workflow_run:
    workflows: ["EcoNext Continuous Integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
      image_tag:
        description: "Custom image tag to deploy (defaults to git commit SHA)"
        required: false
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Verify CI Conclusion
  # ============================================================================
  verify-ci:
    name: Verify CI Prerequisites
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Report CI Validation Status
        run: |
          echo "=========================================================================="
          echo "CI VALIDATION PASSED"
          echo "=========================================================================="
          echo "Trigger Event: ${{ github.event_name }}"
          echo "Target Branch: ${{ github.ref_name || github.event.workflow_run.head_branch }}"
          echo "Commit SHA:    ${{ github.sha }}"
          echo "Execution authorized for Continuous Deployment."
          echo "=========================================================================="

  # ============================================================================
  # 2. Build & Publish Immutable Container Images to GHCR
  # ============================================================================
  publish-images:
    name: Build & Publish Container Images (GHCR)
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Image Tagging & GHCR Metadata
        id: meta
        run: |
          REGISTRY="ghcr.io"
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          SHA_TAG="${{ github.sha }}"
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            DEPLOY_TAG="${{ github.event.inputs.image_tag }}"
          else
            DEPLOY_TAG="$SHA_TAG"
          fi

          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT
          echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

          echo "Configured GHCR Registry: $REGISTRY"
          echo "Repository Owner (lower): $OWNER_LOWER"
          echo "Target Deployment Tag:   $DEPLOY_TAG"
          echo "Immutable SHA Tag:       $SHA_TAG"

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover and Publish Containerized Components
        run: |
          REGISTRY="${{ steps.meta.outputs.registry }}"
          OWNER="${{ steps.meta.outputs.owner_lower }}"
          TAG="${{ steps.meta.outputs.deploy_tag }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"

          echo "Scanning repository for containerizable application components..."

          # Registered service definitions: <image-name>:<context-dir>:<dockerfile-path>
          SERVICES=(
            "econext-backend:backend:backend/Dockerfile"
            "econext-customer-frontend:frontend:frontend/Dockerfile"
            "econext-admin-frontend:admin-frontend:admin-frontend/Dockerfile"
            "econext-api-gateway:microservices/api-gateway:microservices/api-gateway/Dockerfile"
            "econext-auth-service:microservices/auth-service:microservices/auth-service/Dockerfile"
            "econext-cart-service:microservices/cart-service:microservices/cart-service/Dockerfile"
            "econext-catalog-service:microservices/catalog-operations-service:microservices/catalog-operations-service/Dockerfile"
            "econext-order-service:microservices/order-operations-service:microservices/order-operations-service/Dockerfile"
            "econext-payment-service:microservices/payment-service:microservices/payment-service/Dockerfile"
            "econext-notification-service:microservices/notification-service:microservices/notification-service/Dockerfile"
            "econext-admin-service:microservices/admin-staff-service:microservices/admin-staff-service/Dockerfile"
            "econext-data-import-service:microservices/data-import-analysis-service:microservices/data-import-analysis-service/Dockerfile"
          )

          PUBLISHED_COUNT=0
          for svc in "${SERVICES[@]}"; do
            IFS=':' read -r IMG_NAME CTX_DIR DF_PATH <<< "$svc"
            if [ -f "$DF_PATH" ]; then
              IMAGE_WITH_SHA="$REGISTRY/$OWNER/$IMG_NAME:$SHA_TAG"
              IMAGE_WITH_LATEST="$REGISTRY/$OWNER/$IMG_NAME:latest"
              echo "------------------------------------------------------------"
              echo "Building & Publishing $IMG_NAME from $DF_PATH..."
              docker build -t "$IMAGE_WITH_SHA" -t "$IMAGE_WITH_LATEST" -f "$DF_PATH" "$CTX_DIR"
              docker push "$IMAGE_WITH_SHA"
              docker push "$IMAGE_WITH_LATEST"
              echo "Published: $IMAGE_WITH_SHA"
              PUBLISHED_COUNT=$((PUBLISHED_COUNT + 1))
            fi
          done

          echo "------------------------------------------------------------"
          if [ "$PUBLISHED_COUNT" -eq 0 ]; then
            echo "NOTICE: No application Dockerfiles are currently committed to the repository."
            echo "Backing infrastructure currently operates via docker-compose.yml"
            echo "with pre-built registry images (MySQL 8, Redis 7, Kafka 7.6, Kafka UI)."
            echo "Application builds are verified as native artifacts during CI."
            echo "When component Dockerfiles are added, GHCR publishing will trigger automatically."
          else
            echo "Successfully built and pushed $PUBLISHED_COUNT component image(s) to GHCR."
          fi

  # ============================================================================
  # 3. Production Deployment Contract (Provider-Neutral)
  # ============================================================================
  deploy-production:
    name: Production Environment Deployment
    needs: [verify-ci, publish-images]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Production Deployment Safety Pre-Flight Audit
        run: |
          echo "=========================================================================="
          echo "ECONEXT PRODUCTION PRE-FLIGHT AUDIT"
          echo "=========================================================================="
          echo "Target Environment: production"
          echo "Git Ref:            ${{ github.ref }}"
          echo "Commit SHA:         ${{ github.sha }}"
          echo "Triggered By:       ${{ github.actor }}"
          echo ""

          echo "CRITICAL PRODUCTION POLICY VERIFICATIONS:"
          echo "--------------------------------------------------------------------------"
          echo "1. JPA Schema Mutation Policy:"
          echo "   * Production Spring services MUST be executed with JPA_DDL_AUTO=validate."
          echo "   * Automatic DDL schema updates ('update', 'create', 'create-drop') are"
          echo "     STRICTLY FORBIDDEN against production databases."
          echo ""
          echo "2. Django Security Policy:"
          echo "   * Production runtime MUST enforce DJANGO_DEBUG=False."
          echo "   * DJANGO_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, and CSRF_TRUSTED_ORIGINS"
          echo "     must match verified production domains."
          echo ""
          echo "3. Payment Gateway Isolation:"
          echo "   * RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET must be securely provisioned."
          echo "   * Live mode transactions are strictly isolated from CI/Test workflows."
          echo "=========================================================================="

      - name: Production Deployment Execution Interface (Provider-Neutral)
        run: |
          echo "=========================================================================="
          echo "DEPLOYMENT INTERFACE: READY FOR TARGET HOSTING INTEGRATION"
          echo "=========================================================================="
          echo "Deployable Release SHA: ${{ github.sha }}"
          echo "Repository:             ${{ github.repository }}"
          echo "Environment:            production"
          echo ""
          echo "The EcoNext repository does not specify a pre-provisioned cloud host"
          echo "(e.g., specific VPS, Kubernetes cluster, or AWS/GCP account)."
          echo "To prevent false deployment assumptions, this step acts as the verified"
          echo "production deployment interface hook."
          echo ""
          echo "Standard Target Hosting Hook Points (documented in docs/CI-CD.md):"
          echo "  - VPS / Docker Compose Host:  Trigger SSH agent or Webhook to pull images and restart"
          echo "  - Kubernetes Cluster:        Apply manifests / Helm chart with image tag ${{ github.sha }}"
          echo "  - Cloud Container Service:   Deploy new task definition / Cloud Run revision"
          echo "=========================================================================="

      - name: Production Health Check Verification Contract
        run: |
          echo "=========================================================================="
          echo "PRODUCTION HEALTH CHECK VERIFICATION CONTRACT"
          echo "=========================================================================="
          echo "Production deployment verification targets verified during architecture inspection:"
          echo ""
          echo "1. Django Monolithic Backend:"
          echo "   - Endpoint: GET /"
          echo "     Expected: HTTP 200 JSON {'message': 'Welcome to EcoNext API', 'version': '1.0.0'}"
          echo "   - Endpoint: GET /api/products/"
          echo "     Expected: HTTP 200 JSON product catalog page"
          echo ""
          echo "2. Spring Cloud API Gateway (Port 8080):"
          echo "   - Endpoint: GET /actuator/health"
          echo "     Expected: HTTP 200 JSON {'status': 'UP'}"
          echo ""
          echo "3. Spring Boot Microservices (Actuator):"
          echo "   - Auth & User Service:                 GET :8081/actuator/health -> UP"
          echo "   - Catalog & Inventory Service:         GET :8082/actuator/health -> UP"
          echo "   - Cart Service:                        GET :8083/actuator/health -> UP"
          echo "   - Order Operations Service:            GET :8084/actuator/health -> UP"
          echo "   - Admin & Staff Service:               GET :8085/actuator/health -> UP"
          echo "   - Data Import & Analysis Service:      GET :8086/actuator/health -> UP"
          echo "   - Payment Service:                     GET :8087/actuator/health -> UP"
          echo "   - Notification Service:                GET :8089/actuator/health -> UP"
          echo ""
          echo "4. Real-Time Telemetry & Tracking WebSocket:"
          echo "   - Endpoint: /ws-tracking"
          echo "     Protocol: STOMP over Native WebSocket / SockJS"
          echo ""
          echo "5. Web Frontends:"
          echo "   - Customer Storefront: GET / -> HTTP 200 HTML"
          echo "   - Admin Portal:       GET / -> HTTP 200 HTML"
          echo "=========================================================================="
