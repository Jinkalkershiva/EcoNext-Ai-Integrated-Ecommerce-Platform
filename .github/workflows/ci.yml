name: EcoNext Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Repository Hygiene & Secret Safety Checks
  # ============================================================================
  security-hygiene:
    name: Security & Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no tracked .env files containing credentials
        run: |
          echo "Checking git index for forbidden tracked .env files..."
          TRACKED_ENV=$(git ls-files | grep -E '^(\.env|\.env\.production|\.env\.staging|\.env\.local|\.env\.development)$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "ERROR: Detected tracked environment file(s) in repository index:"
            echo "$TRACKED_ENV"
            echo "Remove with 'git rm --cached <file>' and ensure it is listed in .gitignore."
            exit 1
          fi
          echo "PASSED: No sensitive .env files tracked in repository index."

      - name: Verify no private cryptographic keys tracked
        run: |
          echo "Checking git index for tracked private keys..."
          TRACKED_KEYS=$(git ls-files | grep -E '\.(pem|key|pkcs12|pfx|id_rsa)$' || true)
          if [ -n "$TRACKED_KEYS" ]; then
            echo "ERROR: Detected private key file(s) tracked in repository index:"
            echo "$TRACKED_KEYS"
            exit 1
          fi
          echo "PASSED: No private keys tracked in repository index."

      - name: Verify working tree hygiene
        run: |
          echo "Checking git diff hygiene..."
          git diff --check || exit 1
          echo "PASSED: Clean git diff check."

  # ============================================================================
  # 2. Django Backend CI (Python 3.13 / Django 5.1 / SQLite CI database)
  # ============================================================================
  django-backend:
    name: Django Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-secret-key-placeholder-32chars-min-for-checks!"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DB_ENGINE: "django.db.backends.sqlite3"
          USE_REDIS: "False"
          RAZORPAY_KEY_ID: "rzp_test_ci_mock_key_id"
          RAZORPAY_KEY_SECRET: "rzp_test_ci_mock_key_secret"
        run: |
          python manage.py check

      - name: Run Django Test Suite
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-secret-key-placeholder-32chars-min-for-checks!"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DB_ENGINE: "django.db.backends.sqlite3"
          USE_REDIS: "False"
          RAZORPAY_KEY_ID: "rzp_test_ci_mock_key_id"
          RAZORPAY_KEY_SECRET: "rzp_test_ci_mock_key_secret"
        run: |
          python manage.py test --no-input

  # ============================================================================
  # 3. Spring Boot Microservices CI (Java 21 / Maven Multi-Module Reactor)
  # ============================================================================
  spring-microservices:
    name: Spring Boot Microservices Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Test Microservices Reactor
        working-directory: microservices
        run: |
          echo "Executing Maven test suite across all 9 microservices and parent POM..."
          mvn -B test

  # ============================================================================
  # 4. Customer React Frontend CI (Node.js 20 / Vite Build)
  # ============================================================================
  customer-frontend:
    name: Customer Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # 5. Admin React Frontend CI (Node.js 20 / Vite Build)
  # ============================================================================
  admin-frontend:
    name: Admin Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "admin-frontend/package-lock.json"

      - name: Install dependencies
        working-directory: admin-frontend
        run: npm ci

      - name: Build production bundle
        working-directory: admin-frontend
        run: npm run build

  # ============================================================================
  # 6. Docker Build Validation (Conditional on presence of Dockerfiles)
  # ============================================================================
  docker-validation:
    name: Container Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and validate Dockerfiles if present
        run: |
          echo "Scanning for application Dockerfiles..."
          DOCKERFILES=$(find . -maxdepth 3 -name "Dockerfile*" -not -path "*/node_modules/*" -not -path "*/.git/*" || true)
          if [ -z "$DOCKERFILES" ]; then
            echo "No application Dockerfiles currently found in repository."
            echo "Backing infrastructure uses verified standard images (MySQL 8, Redis 7, Kafka 7.6, Kafka UI)."
            echo "Docker build validation cleanly skipped."
          else
            echo "Found Dockerfiles:"
            echo "$DOCKERFILES"
            for df in $DOCKERFILES; do
              dir=$(dirname "$df")
              if [[ "$df" == *"microservices"* ]]; then
                dir="microservices"
              fi
              echo "Validating Docker build for $df in directory $dir..."
              docker build "$dir" -f "$df"
            done
          fi
